<style>
  :root {
    --blue: #3E69B2;
    --paper: #ffffff;
    --ink: #111418;
    --muted: #5a5f68;
    --line: #e3e3e0;
    --slot: #f6f6f3;
    --sans: "Libre Franklin", "Helvetica Neue", Arial, sans-serif;
    --serif: "Merriweather", Georgia, "Times New Roman", serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #17191d; --ink: #ecebe7; --muted: #a4a7ad; --line: #30333a; --slot: #1f2227;
    }
  }
  :root[data-theme="dark"] {
    --paper: #17191d; --ink: #ecebe7; --muted: #a4a7ad; --line: #30333a; --slot: #1f2227;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 17px; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  main { overflow-x: clip; }
  .wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 28px; }
  .numeral { font-family: var(--serif); font-weight: 900; color: #000; line-height: 1; letter-spacing: -0.01em; }

  /* ---------- Blackbird ---------- */
  .bird { display: block; }
  .bird .eye { transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: no-preference) {
    .home .bird .eye { animation: glance 7s ease-in-out infinite; }
    @keyframes glance {
      0%, 40%, 100% { transform: translateX(0); }
      46%, 60% { transform: translateX(-1.6px); }
      66%, 80% { transform: translateX(1px); }
    }
  }

  /* ---------- Opening flock ---------- */
  .cover { position: relative; isolation: isolate; }
  .cover > .wrap { position: relative; z-index: 1; }
  .flock-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .flock-layer.back { z-index: 0; }
  .flock-layer.front { z-index: 2; }
  .cover.intro { cursor: pointer; }
  /* ---------- Opening: one bird, thirteen ways ---------- */
  .cover.intro .word { opacity: 0; transform: translateY(.14em); filter: blur(4px); }
  .cover .word { display: inline-block; transition: opacity .9s ease, transform .9s ease, filter .9s ease; }
  .cover.intro .word.on { opacity: 1; transform: none; filter: none; }
  .cover.arrived .school { animation: settle .9s ease-out both; }
  @keyframes perch { from { opacity: 0; } to { opacity: 1; } }
  .solo { position: fixed; left: 0; top: 0; pointer-events: none; will-change: transform; }
  .solo svg { display: block; width: 100%; overflow: visible; }
  .sky { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .sky.back { z-index: 0; }
  .sky.front { z-index: 2; }
  .count { position: fixed; right: max(28px, env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
           z-index: 2; font-family: var(--serif); font-weight: 900; font-size: 22px; color: #000; pointer-events: none; transition: opacity .3s ease; }
  .flyer { position: absolute; left: 0; top: 0; will-change: transform; }
  .flyer svg { display: block; width: 100%; overflow: visible; }
  .flyer .wing { transform-origin: 47px 28px; animation: flap var(--f, .34s) ease-in-out infinite alternate; }
  .flyer .wing.far { animation-delay: calc(var(--f, .34s) * -0.35); }
  .flyer.glide .wing { animation-play-state: paused; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(-0.75); } }

  .cover .wrap > * { transition: opacity .8s ease, filter .8s ease; }
  .cover.intro .school, .cover.intro .date { opacity: 0; }
  .cover.intro .title .bird { opacity: 0; }
  .cover.veiled .subject { transition: none; opacity: var(--reveal, .05); filter: blur(calc((1 - var(--reveal, .05)) * 7px)); }
  .cover.shout .school, .cover.shout .date { animation: settle .9s ease-out both; }
  .cover.shout .date { animation-delay: .2s; }
  .cover.shout .title .bird { animation: land 1.4s cubic-bezier(.3,1.35,.5,1) both; }
  @keyframes settle { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes land {
    0%   { opacity: 0; transform: translate(-160px, -190px) rotate(-26deg) scale(1.25); }
    30%  { opacity: 1; }
    100% { opacity: 1; transform: none; }
  }
  .title, .subject { transform-origin: left center; }

  /* ---------- Home ---------- */
  .cover { background: var(--blue); color: #fff; padding: 12vh 0 10vh; min-height: 100vh; display: flex; align-items: center; }

  /* ---------- Way page ---------- */
  .hero { background: var(--c); color: #fff; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; padding: 26px 0; }

  /* ---------- Evening band (home) ---------- */
  .evening { border-bottom: 1px solid var(--line); padding: 44px 0; }
  .evening .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px; }

  /* ---------- About the evening ---------- */

  .home-section { padding: 80px 0 40px; }
  .home-section h2 { font-weight: 800; font-size: clamp(32px, 4.4vw, 52px); line-height: 1.05; letter-spacing: -0.025em; margin: 0 0 14px; max-width: 18ch; }

  .ema-hero h1 { margin: 0; font-weight: 800; font-size: clamp(42px, 6vw, 76px); line-height: 1.02; letter-spacing: -0.03em; }
  .ema-hero-sub { margin: 18px 0 0; font-size: 20px; font-weight: 300; color: #fff; max-width: 40ch; line-height: 1.45; }
  .ema-rack { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3%; padding-top: 4px; margin-bottom: 64px; align-items: start; }

  }

  "Chadd Clairmont": "Chadd Clairmont joined Avenues in 2025 and currently teaches Intro to Calculus and Advanced Computer Science courses. A math teacher with a background in software development, he previously spent five years at Blair Academy in New Jersey teaching Algebra 2 and Advanced Statistics, where he built a statistics program around interactive lessons and large real-world data sets. Before teaching full time, he worked as a lead web developer and taught coding to younger students at The Coding Space. Chadd holds bachelor’s degrees in mathematics and computer science from Rollins College.",
  "Chris Richter": "Chris Richter rejoined Avenues New York in 2022. Focusing on World Course, Chris brings a decade of experience from Southington Public Schools, where he taught history and civics in the middle and upper grades, as well as experience teaching at Sidwell Friends School in Washington, D.C. In 2015, he was named Teacher of the Year by Southington Public Schools and was featured in the <em>Southington Observer</em> article “Planning for Technology: School District Continues to Plan Long Term.”",
  "Ranjan Roy": "Ranjan Roy is VP, Industry Lead—Retail at Writer, where he advises CMOs and leadership teams at the world’s largest enterprises on AI strategy. With a 15-year career at the intersection of language, AI, and business, he has built and deployed applied AI across startups and corporations. He co-founded Informerly, an NLP-powered news personalization startup, and later pioneered generative AI for content at scale as SVP of Strategy at Adore Me. A <em>Vogue Business</em> 2024 Top 100 Innovator, Ranjan is also co-author of <em>Margins</em>, a newsletter with over 35,000 subscribers exploring how technology shapes business and society. He has appeared regularly on CNBC and been featured in <em>The New York Times</em>.",
  "Sinan Aral": "Sinan Aral is a scientist, entrepreneur, and investor who has been ranked among the top 50 management scholars in the world for the last five years and was rated the world’s “Top Digital Thinker” in 2021. One of the youngest tenured professors in the history of the MIT Sloan School, Sinan is the David Austin Chaired Professor of Management, Marketing, IT and Data Science at MIT, director of the MIT Initiative on the Digital Economy (IDE), and a co-founder and general partner of two venture capital firms: Manifest Capital and Milemark Capital. He has been called “one of the first and most prescient scholars of social media” by former U.S. Under Secretary of State Richard Stengel. His first book, <em>The Hype Machine</em>, which <em>New York</em> magazine called “prophetic,” was named a 2020 Best Book on Artificial Intelligence by <em>WIRED</em>. He is currently working on his second book, <em>Personal Intelligence</em>, about the hidden wave of AI personalization shaping our relationship to AI, to be published by W. W. Norton.",

  "Scarlett Cheng": "Sijia (Scarlett) Cheng joined Avenues in 2023 and teaches Chinese-side art for the ELC and Lower Division. She holds a master’s degree in Art Education from Teachers College, Columbia University, and a bachelor’s degree in Textile/Surface Design from the Fashion Institute of Technology. Her interests include art and technology, textile design, and digital art, with experience using Photoshop, Illustrator, Unreal Engine, Blender, and Unity.",

        <p>The name holds the history. In ancient Japan, people who could afford it offered real horses to the shrines, since horses were believed to carry messages to the <i>kami</i>, the spirits who dwell in the natural world. Over the centuries the living horse became a sculpted one, then a painted one, and finally a simple wooden tablet that anyone could offer. The messenger shrank, but the act stayed the same: put your wish into a form that can travel to something larger than yourself.</p>

function playIntro() {
  const cover = app.querySelector(".cover");
  if (!cover) return;
  const words = [...cover.querySelectorAll(".word")];
  const titleBird = cover.querySelector(".title .bird");
  cover.classList.add("intro");

  const back = document.createElement("div"), front = document.createElement("div");
  back.className = "sky back"; front.className = "sky front";
  [back, front].forEach(l => l.setAttribute("aria-hidden", "true"));
  const count = document.createElement("div");
  count.className = "count"; count.setAttribute("aria-hidden", "true");

  cover.append(front, count);

  const W = innerWidth, H = innerHeight, U = Math.min(W, H);
  const P = (x, y) => [x * W, y * H];
  const wr = (i) => { const r = words[i].getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2, l: r.left, t: r.top, w: r.width, h: r.height }; };
  const Wd = words.map((_, i) => wr(i));
  const at = (i, fx, fy) => [Wd[i].x + fx * W, Wd[i].y + fy * H];
  const TAU = Math.PI * 2, DEG = 180 / Math.PI;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;

  // Where the last bird will sit: exactly where the title's perched bird is drawn.
  const tb = titleBird.getBoundingClientRect();
  const kFinal = tb.width / 128;
  const feetFinal = [tb.left + tb.width * (58 / 128), tb.top + tb.height * (100 / 114)];
  // Birds are steered by their body centre, which sits 45 units above the feet.
  const perchAt = (feet, k) => [feet[0], feet[1] - 45 * k];

  // Landing on the letters of "at…" (on top of the "a").
  const atW = Wd[4];
  const sz = (f) => f * U * 1.35;
  const kOf = (px) => px / 180;

  /* ----------------------------------------------------------------
     Choreography: 13 birds. Each has a start time, a size (as a share
     of the screen), an entry point, and a sequence of flights (cubic
     curves; "smooth" continues the previous curve's direction) and perches.
     ---------------------------------------------------------------- */
  const S = [];
  // I — glides across "Thirteen", lands in the far upper-right corner, rests, flies off.
  S.push({ t: 200, px: sz(.16), from: [-0.08 * W, Wd[0].y - .12 * H], segs: [
    { c1: P(.08, .12), c2: at(0, -.12, .05), to: at(0, .1, -.02), dur: 1100, ease: "linear", wing: "auto", reveal: 0, revealAt: .6 },
    { c1: "smooth", c2: P(.84, .05), to: P(.9, .1), dur: 1700, ease: "out", land: true },
    { perch: 900 },
    { c1: P(.95, .04), c2: P(1.02, .02), to: P(1.15, -.1), dur: 1200, ease: "in" } ] });
  // II — a steep, banking climb from the lower left, out through the top.
  S.push({ t: 1500, px: sz(.2), from: P(-.08, 1.06), segs: [
    { c1: P(.12, .9), c2: P(.2, .66), to: P(.3, .42), dur: 1400, ease: "linear", wing: "flap", hz: 1.25 },
    { c1: "smooth", c2: P(.42, .06), to: P(.47, -.16), dur: 1100, ease: "linear", wing: "flap", hz: 1.35 } ] });
  // III — dives from above through "Ways", pulls up and away to the right.
  S.push({ t: 2300, px: sz(.2), from: at(1, -.12, -.6), segs: [
    { c1: at(1, -.1, -.3), c2: at(1, -.08, -.02), to: at(1, .04, .05), dur: 1200, ease: "linear", wing: "glide", reveal: 1, revealAt: .8 },
    { c1: "smooth", c2: P(.84, .2), to: P(1.15, -.02), dur: 1400, ease: "linear", wing: "flap" } ] });
  // IV — a large, close bird glides low from the right across "of".
  S.push({ t: 3200, px: sz(.34), from: [1.2 * W, Wd[2].y + .2 * H], segs: [
    { c1: [.98 * W, Wd[2].y + .14 * H], c2: at(2, .1, .02), to: at(2, -.04, 0), dur: 1500, ease: "linear", wing: "glide", reveal: 2, revealAt: .88 },
    { c1: "smooth", c2: [.18 * W, Wd[2].y - .08 * H], to: [-.3 * W, Wd[2].y - .06 * H], dur: 1700, ease: "linear", wing: "flap", hz: .75 } ] });
  // V — a tiny, distant bird crosses high behind the lettering.
  S.push({ t: 3700, px: sz(.07), layer: "back", op: .8, from: P(-.05, .09), segs: [
    { c1: P(.3, .03), c2: P(.62, .13), to: P(1.06, .06), dur: 4200, ease: "linear", wing: "flap", hz: 1.1 } ] });
  // VI — a small bird bounds along (flap, fold, flap) over "Looking".
  S.push({ t: 4500, px: sz(.14), from: [-.1 * W, Wd[3].y + .05 * H], segs: [
    { c1: [.04 * W, Wd[3].y + .02 * H], c2: at(3, -.12, -.02), to: at(3, .04, -.01), dur: 1400, ease: "linear", wing: "bound", reveal: 3, revealAt: .75 },
    { c1: "smooth", c2: [.8 * W, Wd[3].y + .07 * H], to: [1.12 * W, Wd[3].y + .03 * H], dur: 1600, ease: "linear", wing: "bound" } ] });
  // VII — comes in from the right and lands on top of "at…", looks around, leaves.
  const k7 = kOf(sz(.15));
  const feet7 = [atW.l + atW.w * .2, atW.t + atW.h * .3];
  S.push({ t: 0, px: sz(.17), from: [1.12 * W, atW.y - .32 * H], segs: [
    { c1: [.92 * W, atW.y - .34 * H], c2: at(4, .12, -.1), to: at(4, -.02, .02), dur: 1400, ease: "linear", wing: "glide", reveal: 4, revealAt: .8 },
    { c1: "smooth", c2: [.18 * W, atW.y - .22 * H], to: [-.15 * W, atW.y - .36 * H], dur: 800, ease: "linear", wing: "flap", hz: 1.25 } ] });
  // VIII — a huge, soft-focus bird sweeps past in the foreground.
  S.push({ t: 6400, px: sz(1.05), blur: 3, from: P(-.45, .95), segs: [
    { c1: P(.15, .78), c2: P(.7, .84), to: P(1.45, .66), dur: 1700, ease: "linear", wing: "flap", hz: .7 } ] });
  // IX — circles down and threads through "Artificial" from the left.
  S.push({ t: 6700, px: sz(.2), from: P(.97, -.1), segs: [
    { c1: P(1.0, .2), c2: at(5, .36, -.2), to: at(5, .18, -.12), dur: 1100, ease: "linear", wing: "glide" },
    { c1: "smooth", c2: at(5, -.28, -.18), to: at(5, -.22, .02), dur: 1000, ease: "linear", wing: "flap" },
    { c1: "smooth", c2: at(5, -.06, .05), to: at(5, .12, .01), dur: 900, ease: "linear", wing: "flap" },
    { c1: "smooth", c2: P(.8, .92), to: P(.95, 1.18), dur: 1100, ease: "linear", wing: "glide" } ] });
  // X — lands in the far lower-left corner, preens, and slips away.
  const k10 = kOf(sz(.13));
  const feet10 = P(.08, .95);
  S.push({ t: 7400, px: sz(.13), from: P(-.1, .58), segs: [
    { c1: P(.12, .6), c2: P(.12, .86), to: perchAt(feet10, k10), dur: 1600, ease: "out", land: true },
    { perch: 800, preen: true },
    { c1: [feet10[0] + .02 * W, feet10[1] - .16 * H], c2: P(.02, .62), to: P(-.14, .5), dur: 1100, ease: "in" } ] });
  // XI — rises from below right and sweeps back through "Intelligence".
  S.push({ t: 8600, px: sz(.24), from: [1.14 * W, Wd[6].y + .2 * H], segs: [
    { c1: [.95 * W, Wd[6].y + .17 * H], c2: at(6, .22, .06), to: at(6, .04, 0), dur: 1400, ease: "linear", wing: "glide" },
    { c1: "smooth", c2: [.06 * W, Wd[6].y - .34 * H], to: [-.16 * W, Wd[6].y - .56 * H], dur: 1500, ease: "linear", wing: "flap", hz: 1.2 } ] });
  // XII — a wide, unhurried arc over the top, behind the words.
  S.push({ t: 9200, px: sz(.12), layer: "back", from: P(-.1, .3), segs: [
    { c1: P(.2, -.06), c2: P(.72, -.06), to: P(1.1, .22), dur: 2600, ease: "linear", wing: "auto", hz: .9 } ] });
  // XIII — crosses the lettering, turns, and settles on the title.
  const final = perchAt(feetFinal, kFinal);
  S.push({ t: 0, px: 180 * kFinal, final: true, from: P(1.08, .92), segs: [
    { c1: P(.86, .94), c2: at(5, .22, .09), to: at(5, -.08, .01), dur: 1500, ease: "linear", wing: "flap", reveal: 5, revealAt: .72 },
    { c1: "smooth", c2: [final[0] - .2 * W, final[1] - .16 * H], to: final, dur: 1300, ease: "out", land: true },
    { perch: Infinity } ] });

  // Pacing: the words appear at a steady reading pace (about one every 0.65 s).
  // Birds that reveal a word are started so they cross it on cue; the others fill
  // in around them. Every other bird is gone before "Artificial" appears. "Intelligence"
  // follows at the same pace, and the last bird touches down on the title just as a
  // reader would be finishing that word.
  const DUR = 0.5;
  const WORD_TIMES = [400, 950, 1500, 2050, 2600, 3150];   // Thirteen … Artificial
  const STARTS = { 1: 400, 4: 175, 7: 975, 8: 1075, 9: 1275, 10: 1500, 11: 1700 };
  S.forEach(b => b.segs.forEach(g => { if (g.dur) g.dur *= DUR; if (g.perch && isFinite(g.perch)) g.perch *= DUR; }));
  const revealOffset = (b) => {
    let acc = 0;
    for (const g of b.segs) {
      if (g.reveal !== undefined) return { word: g.reveal, off: acc + g.dur * (g.revealAt ?? .8) };
      acc += g.perch !== undefined ? g.perch : g.dur;
    }
    return null;
  };
  S.forEach((b, i) => {
    if (b.final) return;
    const r = revealOffset(b);
    b.t = r ? Math.max(0, WORD_TIMES[r.word] - r.off) : STARTS[i];
  });
  const lifetime = (b) => b.segs.reduce((n, g) => n + (g.perch !== undefined ? g.perch : g.dur), 0);
  const lastExit = Math.max(...S.filter(b => !b.final).map(b => b.t + lifetime(b)));
  const fin = S.find(b => b.final);
  const finReveal = fin.segs[0].dur * fin.segs[0].revealAt;
  fin.t = Math.max(WORD_TIMES[5], lastExit + 60) - finReveal;
  const WORD_GAP = 550;      // same rhythm as the words before it
  const READ_TIME = 850;     // the word fades in, then takes a moment to read
  const intelT = fin.t + finReveal + WORD_GAP;
  const landT = intelT + READ_TIME;
  fin.segs[1].dur = Math.max(500, landT - (fin.t + fin.segs[0].dur));
  let intelShown = false;

  /* ---------------- The birds themselves ---------------- */
  const ease = {
    linear: u => u,
    in: u => 1 - Math.cos(u * Math.PI / 2),
    out: u => Math.sin(u * Math.PI / 2),
    inout: u => (1 - Math.cos(Math.PI * u)) / 2
  };
  const bez = (a, b, c, d, t) => { const m = 1 - t; return m * m * m * a + 3 * m * m * t * b + 3 * m * t * t * c + t * t * t * d; };

  function prepare(b, i) {
    b.k = b.px / 180;
    b.i = i;
    let p0 = b.from, prevC2 = null;
    b.segs.forEach(sg => {
      if (sg.perch !== undefined) { sg.p = p0; return; }
      sg.p0 = p0;
      sg.c1 = sg.c1 === "smooth" ? [p0[0] + (p0[0] - prevC2[0]), p0[1] + (p0[1] - prevC2[1])] : sg.c1;
      prevC2 = sg.c2; p0 = sg.to;
    });
    let acc = 0;
    b.segs.forEach(sg => { sg.start = acc; acc += sg.perch !== undefined ? sg.perch : sg.dur; });
    b.end = acc;

             pb: 0, head: 0, tail: 0, crouch: 0, px: null, py: null, bound: 0 };
  }

  function spawn(b) {
    const el = document.createElement("div");
    el.className = "solo";
    el.style.width = b.px + "px";
    el.style.transformOrigin = `${70 * b.k}px ${110 * b.k}px`;
    if (b.op) el.style.opacity = b.op;
    if (b.blur) el.style.filter = `blur(${b.blur}px)`;
    el.innerHTML = `<svg viewBox="-70 -110 180 140">${FLYING}<g class="pgroup" opacity="0">${PERCHED}</g></svg>`;
    (b.layer === "back" ? back : front).appendChild(el);
    b.el = el;
    b.q = {
      f: el.querySelector(".fgroup"), p: el.querySelector(".pgroup"),
      far: el.querySelector(".w-far"), near: el.querySelector(".w-near"), cov: el.querySelector(".w-cov"),
      shafts: el.querySelector(".w-shafts"), legs: el.querySelector(".legs"),
      head: el.querySelector(".pgroup .phead"), tail: el.querySelector(".pgroup .ptail")
    };
  }

  function wingPath(pts, st, ox, oy, scale) {
    const d = pts.map(([x, y], j) => {
      let X = x * (1 - .38 * st.fold) + y * .32 * st.fold;
      let Y = y * st.s * (1 - .2 * st.fold);
      X *= st.shrink * scale; Y *= st.shrink * scale;
      return (j ? "L" : "M") + (ox + X).toFixed(1) + " " + (oy + Y).toFixed(1);
    });
    return d.join(" ") + " Z";
  }
  function shaftPath(st) {
    return SHAFTS.map(([a, c]) => {
      const f = ([x, y]) => [(x * (1 - .38 * st.fold) + y * .32 * st.fold) * st.shrink + 34, y * st.s * (1 - .2 * st.fold) * st.shrink - 6];
      const A = f(a), C = f(c);
      return `M${A[0].toFixed(1)} ${A[1].toFixed(1)} L${C[0].toFixed(1)} ${C[1].toFixed(1)}`;
    }).join(" ");
  }

  function update(b, t, dt) {
    const st = b.st;
    const local = t - b.t;
    let sg = b.segs.find(g => local < g.start + (g.perch !== undefined ? g.perch : g.dur));
    if (!sg) return false;
    const idx = b.segs.indexOf(sg);
    const prev = b.segs[idx - 1];
    let x, y, u = 0, perched = false;

    if (sg.perch !== undefined) {
      perched = true;
      if (prev && prev.revealOnLand !== undefined) words[prev.revealOnLand].classList.add("on");
      [x, y] = sg.p;
      const pt = local - sg.start;
      st.pb = lerp(st.pb, 1, .35);
      // Blackbirds cock the tail on landing, then look about.
      st.tail = pt < 500 ? -24 * Math.sin(Math.PI * pt / 500) : lerp(st.tail, 0, .2);
      const look = sg.preen ? Math.sin(pt / 180) * 14 : Math.sin(pt / 420) * 9 + (pt > 700 && pt < 900 ? -6 : 0);
      st.head = lerp(st.head, look, .12);
      const left = sg.perch - pt;
      st.crouch = left < 220 && isFinite(sg.perch) ? (220 - left) / 220 * 3.5 : lerp(st.crouch, 0, .3);
      if (left < 120) st.pb = lerp(st.pb, 0, .5);
      st.s = lerp(st.s, 1, .3); st.fold = lerp(st.fold, 0, .3);
      st.phi = 0;
    } else {
      u = clamp((local - sg.start) / sg.dur, 0, 1);
      const e = ease[sg.ease || "linear"](u);
      x = bez(sg.p0[0], sg.c1[0], sg.c2[0], sg.to[0], e);
      y = bez(sg.p0[1], sg.c1[1], sg.c2[1], sg.to[1], e);
      st.pb = lerp(st.pb, 0, .45);
      st.crouch = lerp(st.crouch, 0, .3);
      if (sg.reveal !== undefined && u >= (sg.revealAt ?? .8)) words[sg.reveal].classList.add("on");
    }

    // velocity and heading
    const vx = st.px === null ? 0 : x - st.px, vy = st.py === null ? 0 : y - st.py;
    const speed = Math.hypot(vx, vy) / Math.max(dt, .5);
    st.px = x; st.py = y;

    if (!perched) {
      if (Math.abs(vx) > .15) st.faceT = vx < 0 ? -1 : 1;
      const climb = Math.atan2(vy, Math.abs(vx) + 1e-6) * DEG;
      const landing = sg.land && u > .62, takeoff = prev && prev.perch !== undefined && u < .35;
      let tiltT = clamp(climb, -48, 48);
      if (landing) tiltT = lerp(tiltT, -38, (u - .62) / .38);
      st.tilt = lerp(st.tilt, tiltT, .12);
      st.legs = lerp(st.legs, landing || takeoff ? 1 : 0, .15);

      let mode = sg.wing || "auto";
      if (landing) mode = "flare";
      else if (takeoff) mode = "takeoff";

      const hz = sg.hz || 1;

      if (mode === "flap" || mode === "takeoff" || mode === "flare") {
        const f = mode === "takeoff" ? 4.4 : mode === "flare" ? 2.3 : (2.9 + clamp(-climb / 30, 0, 1.2)) * hz;
        st.phi = (st.phi + TAU * f * dt / 1000) % TAU;
        sT = Math.cos(st.phi);
        foldT = st.phi > Math.PI ? Math.sin(st.phi - Math.PI) * (mode === "flare" ? .25 : 1) : 0;
        if (mode === "flare") sT = .35 + .65 * Math.cos(st.phi);
      } else if (mode === "glide") {
        sT = .34 + .05 * Math.sin(t / 300 + b.i); foldT = 0;
        st.phi = 0;
      } else if (mode === "bound") {
        st.bound = (st.bound + dt) % 900;
        if (st.bound < 480) {
          st.phi = (st.phi + TAU * 4 * dt / 1000) % TAU;
          sT = Math.cos(st.phi); foldT = st.phi > Math.PI ? Math.sin(st.phi - Math.PI) : 0;
        } else { sT = .12; foldT = 1; shrinkT = .62; }
        y += Math.sin(st.bound / 900 * TAU) * .012 * U;
      }
      const snap = mode === "glide" || shrinkT < 1 ? .2 : .6;
      st.s = lerp(st.s, sT, snap); st.fold = lerp(st.fold, foldT, snap); st.shrink = lerp(st.shrink, shrinkT, .2);
    } else {
      // Turn to face the way it will leave, just before taking off.
      const nxt = b.segs[idx + 1];

      st.tilt = lerp(st.tilt, 0, .25);
      st.legs = 1;
    }
    st.face = lerp(st.face, st.faceT, .22);
    const face = Math.abs(st.face) < .06 ? (st.face < 0 ? -.06 : .06) : st.face;

    // draw
    const q = b.q, k = b.k;
    q.far.setAttribute("d", wingPath(WING, st, 40, -9, .82));
    q.near.setAttribute("d", wingPath(WING, st, 34, -6, 1));
    q.cov.setAttribute("d", wingPath(COVERTS, st, 34, -6, 1));
    q.shafts.setAttribute("d", shaftPath(st));
    q.legs.setAttribute("opacity", st.legs.toFixed(2));
    q.f.setAttribute("transform", `translate(-28 -45) rotate(${st.tilt.toFixed(1)} 28 0)`);
    q.f.setAttribute("opacity", (1 - st.pb).toFixed(2));
    q.p.setAttribute("opacity", st.pb.toFixed(2));
    q.p.setAttribute("transform", `translate(0 ${st.crouch.toFixed(1)})`);
    q.head.setAttribute("transform", `rotate(${st.head.toFixed(1)} 32 -74)`);
    q.tail.setAttribute("transform", `rotate(${st.tail.toFixed(1)} -10 -32)`);
    const fx = x, fy = y + 45 * k; // feet position
    b.el.style.transform = `translate(${(fx - 70 * k).toFixed(1)}px, ${(fy - 110 * k).toFixed(1)}px) scale(${face.toFixed(3)},1)`;

    if (b.final && sg.perch !== undefined && local - sg.start > 160) return "landed";
    return true;
  }

  S.forEach(prepare);
  let t0 = null, last = null, done = false, shown = -1, spawned = 0;

  function showCount(i) {
    if (i === shown) return;
    shown = i;
    count.style.opacity = 0;
    setTimeout(() => { if (!done) { count.textContent = WAYS[i].n; count.style.opacity = 1; } }, 160);
  }

  function finish() {
    if (done) return;
    done = true;
    words.forEach(w => w.classList.add("on"));
    back.remove(); front.remove();
    count.style.opacity = 0;
    setTimeout(() => count.remove(), 400);
    cover.classList.remove("intro");
    cover.classList.add("arrived");
    cover.removeEventListener("click", finish);
    removeEventListener("keydown", finish);
  }
  cover.addEventListener("click", finish);
  addEventListener("keydown", finish);

  function frame(ts) {
    if (done) return;
    if (t0 === null) { t0 = ts; last = ts; }
    const t = ts - t0, dt = Math.min(50, ts - last);
    last = ts;
    if (!intelShown && t >= intelT) { intelShown = true; words[6].classList.add("on"); }
    for (const b of S) {
      if (b.gone || t < b.t) continue;
      if (!b.el) { spawn(b); showCount(spawned++); }
      const r = update(b, t, dt);
      if (r === "landed") { finish(); return; }
      if (!r) { b.gone = true; b.el.remove(); }
    }
    if (t > 20000) { finish(); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

const HOME_SECTIONS = ["about", "agenda", "poem", "catalog"];

/* ---------- Search ---------- */
const strip = (h) => { const d = document.createElement("div"); d.innerHTML = h; return d.textContent; };
function buildIndex() {
  const items = [];
  const add = (o) => { const h = (o.title + " " + o.text + " " + o.kind + " " + (o.keys || "")).toLowerCase(); items.push({ ...o, hay: h.includes("a.i.") ? h + " ai" : h }); };
  // The site's main sections, so searching a section's name finds it directly.

let INDEX = null;
const esc = (t) => t.replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const italEma = (h) => h.replace(/(^|[^\w-])(ema)(?![\w-])/gi, "$1<i>$2</i>");
function highlight(text, terms) {
  let out = esc(text);
  terms.forEach(t => { if (t) out = out.replace(new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>"); });
  return out;
}
function snippet(text, terms) {
  const low = text.toLowerCase(); let at = -1;
  for (const t of terms) { at = low.indexOf(t); if (at >= 0) break; }
  if (at < 0) return text.length > 140 ? text.slice(0, 140) + "…" : text;
  const start = Math.max(0, at - 50);
  return (start ? "…" : "") + text.slice(start, start + 150) + (start + 150 < text.length ? "…" : "");
}
function runSearch(q) {
  INDEX = INDEX || buildIndex();
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return INDEX.map(it => {
    if (!terms.every(t => it.hay.includes(t))) return null;
    const tl = it.title.toLowerCase();
    let score = 0;
    terms.forEach(t => { if (tl.startsWith(t)) score += 6; else if (tl.includes(t)) score += 4; else score += 1; });
    if (it.kind.startsWith("Faculty") || it.kind.startsWith("Presenter")) score += 1;
    if (it.section && terms.some(t => tl.includes(t))) score += 10;
    return { it, score };
  }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 30).map(r => r.it);
}
(function setupSearch() {
  const btn = document.querySelector(".search-btn"), box = document.querySelector(".search");
  const input = box.querySelector("input"), list = box.querySelector(".search-results");
  let active = -1;
  const open = () => { box.hidden = false; input.value = ""; render(); setTimeout(() => input.focus(), 10); };
  const close = () => { box.hidden = true; btn.focus(); };
  function render() {
    const q = input.value.trim(), res = runSearch(q);
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    active = res.length ? 0 : -1;
    if (!q) { list.innerHTML = `<p class="search-empty">Try a name, a topic like “reading” or “China,” or a room.</p>`; return; }
    if (!res.length) { list.innerHTML = `<p class="search-empty">Nothing found for “${esc(q)}.”</p>`; return; }
    list.innerHTML = res.map((r, i) => `
      <a href="${r.href}" role="listitem" class="${i === 0 ? "active" : ""}" style="--c:${r.c || "#3E69B2"}">
        <span class="swatch"></span>
        <span><span class="kind">${esc(r.kind)}</span><span class="ttl">${italEma(highlight(r.title, terms))}</span>
        ${r.text ? `<span class="snip">${italEma(highlight(snippet(r.text, terms), terms))}</span>` : ""}</span>
      </a>`).join("");
  }
  function move(d) {
    const links = [...list.querySelectorAll("a")]; if (!links.length) return;
    links[active]?.classList.remove("active");
    active = (active + d + links.length) % links.length;
    links[active].classList.add("active"); links[active].scrollIntoView({ block: "nearest" });
  }
  btn.addEventListener("click", open);
  input.addEventListener("input", render);
  box.querySelector(".search-close").addEventListener("click", close);
  box.addEventListener("click", e => { if (e.target === box) close(); });
  list.addEventListener("click", e => { if (e.target.closest("a")) { box.hidden = true; if (e.target.closest("a").getAttribute("href") === location.hash) route(); } });
  input.addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
    else if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
    else if (e.key === "Enter") { const a = list.querySelectorAll("a")[active]; if (a) { box.hidden = true; if (a.getAttribute("href") === location.hash) route(); else location.hash = a.getAttribute("href"); } }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !box.hidden) close();
    else if (e.key === "/" && box.hidden && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); open(); }
  });
})();
function route() {
  const parts = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/");
  const n = parts[0], sub = parts[1];
  app.removeAttribute("style");
  if (idx(n) >= 0) renderWay(n); else if (n === "ema") renderEma(); else renderHome();
  const section = HOME_SECTIONS.includes(n) ? document.getElementById(n)
    : (idx(n) >= 0 && sub ? document.getElementById("course-" + sub) : null);
  if (section) section.scrollIntoView(); else window.scrollTo(0, 0);
  if (!introPlayed) {
    introPlayed = true;
    if (!n && !calmMotion()) playIntro();
  }
}
window.addEventListener("hashchange", route);
route();
